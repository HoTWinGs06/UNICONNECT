<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniConnect — Campus Networking Platform</title>
  <meta name="description" content="UniConnect is a modern university networking and collaboration platform combining LinkedIn-style professional profiles with Discord-style community servers. Connect, learn, and grow with your campus community."/>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary': '#005cbb',
            'on-primary': '#ffffff',
            'primary-container': '#002147',
            'on-primary-container': '#b0caff',
            'primary-fixed': '#d6e3ff',
            'secondary': '#0058bc',
            'on-secondary': '#ffffff',
            'secondary-container': '#e0edff',
            'on-secondary-container': '#001b3f',
            'surface': '#fafafa',
            'on-surface': '#1a1c1e',
            'surface-variant': '#e1e2ec',
            'on-surface-variant': '#44474f',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#f4f5fa',
            'surface-container': '#eeeef4',
            'surface-container-high': '#e8e9ef',
            'surface-container-highest': '#e2e3e9',
            'surface-bright': '#f8f9ff',
            'surface-tint': '#3366cc',
            'outline': '#74777f',
            'outline-variant': '#c4c6cf',
            'background': '#f8f9ff',
            'on-background': '#191c20',
            'inverse-surface': '#2e3036',
            'inverse-on-surface': '#f0f0f7',
          },
          fontFamily: {
            'display-lg': ['Inter', 'sans-serif'],
            'display-md': ['Inter', 'sans-serif'],
            'headline-lg': ['Inter', 'sans-serif'],
            'headline-md': ['Inter', 'sans-serif'],
            'headline-lg-mobile': ['Inter', 'sans-serif'],
            'body-lg': ['Inter', 'sans-serif'],
            'body-md': ['Inter', 'sans-serif'],
            'body-sm': ['Inter', 'sans-serif'],
            'label-lg': ['Inter', 'sans-serif'],
            'label-md': ['Inter', 'sans-serif'],
            'label-sm': ['Inter', 'sans-serif'],
          },
          fontSize: {
            'display-lg': ['2.5rem', { lineHeight: '1.2', fontWeight: '800' }],
            'display-md': ['2rem', { lineHeight: '1.25', fontWeight: '700' }],
            'headline-lg': ['1.75rem', { lineHeight: '1.3', fontWeight: '700' }],
            'headline-md': ['1.25rem', { lineHeight: '1.4', fontWeight: '600' }],
            'headline-lg-mobile': ['1.5rem', { lineHeight: '1.35', fontWeight: '700' }],
            'body-lg': ['1.0625rem', { lineHeight: '1.6', fontWeight: '400' }],
            'body-md': ['0.9375rem', { lineHeight: '1.55', fontWeight: '400' }],
            'body-sm': ['0.8125rem', { lineHeight: '1.5', fontWeight: '400' }],
            'label-lg': ['0.9375rem', { lineHeight: '1.4', fontWeight: '500' }],
            'label-md': ['0.8125rem', { lineHeight: '1.4', fontWeight: '500' }],
            'label-sm': ['0.6875rem', { lineHeight: '1.35', fontWeight: '500' }],
          },
          spacing: {
            'gutter': '16px',
            'container-padding-mobile': '16px',
            'container-padding-desktop': '24px',
            'stack-sm': '8px',
            'stack-md': '12px',
            'stack-lg': '16px',
          },
          borderRadius: {
            'DEFAULT': '0.125rem',
            'sm': '0.25rem',
            'md': '0.5rem',
            'lg': '0.75rem',
            'xl': '1rem',
          },
        },
      },
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css"/>
</head>

<body class="bg-background text-on-surface antialiased">

  <!-- ========== APP SHELL ========== -->
  <div class="flex min-h-screen">

    <!-- Desktop Sidebar -->
    <aside id="app-sidebar" class="hidden md:flex w-64 bg-surface border-r border-outline-variant flex-col shrink-0 sticky top-0 h-screen">
      <!-- Brand -->
      <div class="p-5 border-b border-outline-variant">
        <a href="#/feed" class="flex items-center gap-2 text-primary-container hover:text-secondary transition-colors">
          <span class="material-symbols-outlined text-secondary text-[28px]" style="font-variation-settings: 'FILL' 1;">hub</span>
          <span class="font-headline-md text-headline-md font-bold text-on-surface">UniConnect</span>
        </a>
      </div>

      <!-- Profile Card -->
      <div class="p-4 border-b border-outline-variant">
        <div class="flex items-center gap-3">
          <div class="relative">
            <img alt="Your Profile" class="w-10 h-10 rounded-full object-cover border border-outline-variant" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDsfUhEUaR28wYVTF9ZZGGatNYTBpLsmECoc0hhuS-BMViNORCBgymuQTyvKR0tTmXcrKhbHMjXl7M67NOtlv_FGnS4l7fv8OqEaoC89z6kcEFvn1ksCyjmM-D5Km14cQjglwFX8Vqu6E3VEujc-q_Z8rBgDjX4_hIyH6JnWS-_iLw_npyirIduyXxVepSwzt6t8WJLOu2_jYaYe629qLkFf-JP8rkVgGbIjlO4GL-CCY8OW1PiUFayezTShe1HkvJbqUAE1FBgyRA"/>
            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-surface rounded-full"></span>
          </div>
          <div class="min-w-0">
            <p class="font-label-md text-label-md text-on-surface truncate font-semibold">Alex Martinez</p>
            <p class="font-label-sm text-label-sm text-on-surface-variant truncate">CS • Junior • 3.72 GPA</p>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <nav id="sidebar-nav" class="flex-1 p-3 space-y-1 overflow-y-auto thin-scrollbar">
        <!-- Populated by app.js -->
      </nav>

      <!-- Quick Actions -->
      <div class="p-3 border-t border-outline-variant space-y-1">
        <a href="#/onboarding" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface transition-all font-label-md text-label-md">
          <span class="material-symbols-outlined text-[20px]">settings</span>
          Settings
        </a>
        <button class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface transition-all font-label-md text-label-md w-full text-left">
          <span class="material-symbols-outlined text-[20px]">logout</span>
          Log Out
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div id="app-main" class="flex-1 flex flex-col min-w-0">

      <!-- Mobile Top Bar -->
      <header id="mobile-top-bar" class="hidden sticky top-0 z-30 bg-surface/95 backdrop-blur-sm border-b border-outline-variant px-4 h-14 items-center gap-3 md:hidden">
        <div class="relative">
          <img alt="You" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDsfUhEUaR28wYVTF9ZZGGatNYTBpLsmECoc0hhuS-BMViNORCBgymuQTyvKR0tTmXcrKhbHMjXl7M67NOtlv_FGnS4l7fv8OqEaoC89z6kcEFvn1ksCyjmM-D5Km14cQjglwFX8Vqu6E3VEujc-q_Z8rBgDjX4_hIyH6JnWS-_iLw_npyirIduyXxVepSwzt6t8WJLOu2_jYaYe629qLkFf-JP8rkVgGbIjlO4GL-CCY8OW1PiUFayezTShe1HkvJbqUAE1FBgyRA"/>
          <span class="absolute bottom-0 right-0 w-2 h-2 bg-green-500 border border-surface rounded-full"></span>
        </div>
        <h1 id="page-title" class="font-headline-md text-headline-md text-on-surface font-semibold text-[16px] flex-1">Campus Feed</h1>
        <button class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors relative">
          <span class="material-symbols-outlined text-[22px]">notifications</span>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        <button class="p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
          <span class="material-symbols-outlined text-[22px]">search</span>
        </button>
      </header>

      <!-- Page Content Mount -->
      <div id="app-content" class="flex-1">
        <!-- Pages render here -->
      </div>

      <!-- Mobile Bottom Nav -->
      <nav id="mobile-bottom-nav" class="hidden fixed bottom-0 left-0 right-0 z-30 bg-surface/95 backdrop-blur-sm border-t border-outline-variant pb-safe md:hidden">
        <div id="mobile-nav-items" class="flex justify-around items-center px-2 py-1">
          <!-- Populated by app.js -->
        </div>
      </nav>
    </div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
